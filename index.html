<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombola</title>
    <!-- Fogli di stile separati -->
    <link rel="stylesheet" href="./css/tombola.css">
    <link rel="stylesheet" href="./css/cartelle.css">
</head>

<body>

    <!-- BLOCCO 1: Tabellone -->
    <div id="tabellone-container">
        <div id="overlay-numero"></div>
        <div id="griglia" class="griglia"></div>
    </div>

    <!-- BANNER COMPATTO -->
    <div class="pannello-info">
        <div class="comandi-gruppo">
            <!-- Pulsante Estrai (unico comando di gioco in evidenza) -->
            <button id="btnEstrai" class="btn-icon btn-estrai" onclick="estraiNumero()" title="Estrai Numero">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <span class="comandi-separatore"></span>

            <!-- Comandi di servizio (attenuati) -->
            <!-- Pulsante Generatore Cartelle -->
            <button id="btnCartelle" class="btn-icon btn-servizio btn-cartelle" onclick="apriModalCartelle()" title="Genera Cartelle">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="3" y1="15" x2="21" y2="15"></line>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                    <line x1="15" y1="3" x2="15" y2="21"></line>
                </svg>
            </button>

            <!-- Pulsante Apri Configurazione -->
            <button id="btnConfig" class="btn-icon btn-servizio" onclick="apriConfig()" title="Configurazione e Impostazioni">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>

            <!-- Pulsante Reset -->
            <button id="btnReset" class="btn-icon btn-servizio btn-reset" onclick="init()" title="Nuova Partita">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6"></path>
                    <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                </svg>
            </button>
        </div>

        <!-- Ultimi Estratti -->
        <div id="storico-container" class="storico-container">
            <span class="storico-titolo">Ultimi:</span>
            <div id="storico-numeri" class="storico-numeri">
                <span class="storico-empty">Nessuno</span>
            </div>
        </div>

        <div class="premio-gruppo">
            <!-- Premio in Palio -->
            <div id="premio-container" class="premio-container" onclick="avanzaPremio()" title="Clicca per avanzare premio">
                <span class="premio-etichetta">In palio:</span>
                <span id="premio-attuale" class="premio-badge">AMBO</span>
                <button type="button" class="btn-premio-next" title="Cambia premio">➔</button>
            </div>

            <!-- Lampadina vincite: visibile solo con cartelle caricate, si accende quando c'è una possibile vincita -->
            <div class="spia-wrapper">
                <button type="button" id="spia-vincite" class="spia-vincite inattiva" onclick="togglePannelloVincite()" title="Nessuna vincita da verificare">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
                        <path d="M9 18h6"></path>
                        <path d="M10 22h4"></path>
                    </svg>
                    <span id="spia-contatore" class="spia-contatore"></span>
                </button>

                <!-- Pannellino di verifica, si apre solo al clic sulla lampadina -->
                <div id="pannello-vincite" class="pannello-vincite">
                    <div class="pannello-vincite-header">
                        <span id="pannello-vincite-titolo" class="pannello-vincite-titolo"></span>
                        <button type="button" class="pannello-vincite-chiudi" onclick="chiudiPannelloVincite()" title="Chiudi">×</button>
                    </div>
                    <div id="pannello-vincite-lista" class="pannello-vincite-lista"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALE GENERATORE CARTELLE -->
    <div id="modal-cartelle" class="modal-overlay">
        <div class="modal-contenuto modal-cartelle-box">
            <h2>Generatore Cartelle</h2>

            <div class="cartelle-form-grid">
                <div class="config-sezione">
                    <label class="config-label" for="titoloCartella">Titolo Cartelle:</label>
                    <input type="text" id="titoloCartella" class="input-text" value="Tombola" oninput="aggiornaAnteprimaCartella()">
                </div>

                <div class="config-sezione">
                    <label class="config-label" for="numCartelle">Quantità (1-100):</label>
                    <input type="number" id="numCartelle" class="input-text" value="20" min="1" max="100">
                </div>

                <div class="config-sezione">
                    <label class="config-label" for="formatoStampa">Formato Stampa / PDF:</label>
                    <select id="formatoStampa" class="select-text">
                        <option value="A4">A4 (4 cartelle per foglio - ~18,6x6,4 cm)</option>
                        <option value="A3">A3 (8 cartelle per foglio - ~13,2x9,3 cm)</option>
                    </select>
                </div>
            </div>

            <div class="anteprima-sezione">
                <label class="config-label">Anteprima Modello:</label>
                <div id="anteprima-cartella-container"></div>
            </div>

            <div class="modal-azioni modal-azioni-cartelle">
                <button id="btnGeneraDataset" class="btn-azione btn-genera" onclick="generaNuovoDatasetCartelle()">⚡ Genera Nuove Cartelle</button>
                <button id="btnDownloadPdf" class="btn-azione btn-pdf" onclick="generaEScaricaPDF()" disabled>Download PDF</button>
                <button id="btnDownloadPng" class="btn-azione btn-img" onclick="esportaComeImmagine()" disabled>Download Immagine (PNG)</button>
                <button id="btnDownloadJson" class="btn-azione btn-json" onclick="esportaFileJSONPartita()" disabled>Download File Partita (.JSON)</button>
                <button id="btnUsaCartelle" class="btn-azione btn-usa" onclick="usaCartelleNellaPartita()" title="Carica subito queste cartelle per il controllo vincite, senza passare dal file .JSON" disabled>▶ Usa nella Partita</button>
                <button class="btn-azione btn-chiudi" onclick="chiudiModalCartelle()">Chiudi</button>
                <!-- Pulsante per aprire le istruzioni nel popup -->
                <button type="button" class="btn-istruzioni" onclick="window.open('istruzioni.html', '_blank', 'width=850,height=700')">
                    📖 Leggi Istruzioni
                </button>
            </div>
        </div>
    </div>

    <!-- AREA NASCOSTA PER LA STAMPA -->
    <div id="area-stampa" class="area-stampa"></div>

    <!-- MODALE CONFIGURAZIONE PARTITA -->
    <div id="modal-config" class="modal-overlay">
        <div class="modal-contenuto">
            <h2>Configurazione Partita</h2>
            <div class="config-sezione">
                <label class="config-label">Lingua Smorfia:</label>
                <div class="lingua-opzioni">
                    <button id="btnLinguaNap" class="btn-lingua attivo" onclick="selezionaLingua('nap')">Napoletano</button>
                    <button id="btnLinguaIta" class="btn-lingua" onclick="selezionaLingua('ita')">Italiano</button>
                </div>
            </div>
            
            <!-- OPZIONE: NUMERI ADIACENTI -->
            <div class="config-sezione">
                <label class="config-label">Regola Vincita di Riga:</label>
                <div class="premi-checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" id="checkNumeriAdiacenti" checked> Richiedi numeri adiacenti</label>
                </div>
            </div>

            <div class="config-sezione">
                <label class="config-label">Premi in palio (attivi):</label>
                <div class="premi-checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" value="AMBO" checked> AMBO</label>
                    <label class="checkbox-item"><input type="checkbox" value="TERNO" checked> TERNO</label>
                    <label class="checkbox-item"><input type="checkbox" value="QUATERNA" checked> QUATERNA</label>
                    <label class="checkbox-item"><input type="checkbox" value="CINQUINA" checked> CINQUINA</label>
                    <label class="checkbox-item"><input type="checkbox" value="TOMBOLA" checked> TOMBOLA</label>
                </div>
            </div>

            <!-- CARICAMENTO FILE PARTITA (.JSON) -->
            <div class="config-sezione">
                <label class="config-label">File Partita (controllo vincite):</label>
                <div class="carica-partita-box">
                    <button type="button" id="btnCaricaPartita" class="btn-carica-partita" onclick="document.getElementById('inputJsonCartelle').click()" title="Carica Partita Cartelle (JSON)">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Carica File (.JSON)
                    </button>
                    <span id="stato-partita" class="stato-partita">Nessuna partita caricata</span>
                </div>
                <input type="file" id="inputJsonCartelle" accept=".json" class="input-nascosto" onchange="caricaFilePartita(event)">
            </div>

            <div class="modal-azioni modal-azioni-config">
                <button class="btn-salva-config" onclick="salvaChiudiConfig()">Salva e Chiudi</button>
                <button type="button" class="btn-chiudi-config" onclick="chiudiConfigSenzaSalvare()">Chiudi</button>
                <!-- Pulsante per aprire le istruzioni nel popup -->
                <button type="button" class="btn-istruzioni" onclick="window.open('istruzioni.html', '_blank', 'width=850,height=700')">
                    📖 Leggi Istruzioni
                </button>
            </div>
        </div>
    </div>

    <!-- INCLUSIONE SCRIPT -->
    <script src="./js/lib/jspdf.umd.min.js"></script>
    <script src="./js/tombola.js"></script>
    <script src="./js/cartelle.js"></script>
</body>

</html>
