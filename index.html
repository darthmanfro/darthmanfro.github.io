<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombola</title>
    <link rel="stylesheet" href="./css/tombola.css">
</head>

<body>

    <!-- BLOCCO 1: Tabellone -->
    <div id="tabellone-container">
        <!-- Overlay per l'effetto gigante -->
        <div id="overlay-numero"></div>
        <div id="griglia" class="griglia">
            <!-- Le 90 caselle verranno generate via JavaScript -->
        </div>
    </div>
    <!-- BANNER COMPATTO -->
    <div class="pannello-info">

        <!-- Comandi principali -->
        <div class="comandi-gruppo">
            <button id="btnEstrai" class="btn-icon btn-estrai" onclick="estraiNumero()" title="Estrai Numero">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <!-- Pulsante Apri Configurazione -->
            <button id="btnConfig" class="btn-icon" onclick="apriConfig()" title="Configurazione e Impostazioni">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>

            <button id="btnReset" class="btn-icon btn-reset" onclick="init()" title="Nuova Partita">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6"></path>
                    <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                </svg>
            </button>
        </div>

        <!-- Ultimi Estratti -->
        <div id="storico-container" class="storico-container">
            <span class="storico-titolo">Ultimi:</span>
            <div id="storico-numeri" class="storico-numeri">
                <span class="storico-empty">Nessuno</span>
            </div>
        </div>

        <!-- Premio in Palio -->
        <div id="premio-container" class="premio-container" onclick="avanzaPremio()" title="Clicca per avanzare premio">
            <span class="premio-etichetta">In palio:</span>
            <span id="premio-attuale" class="premio-badge">AMBO</span>
            <button type="button" class="btn-premio-next" title="Cambia premio">➔</button>
        </div>

    </div>

    <!-- PANNELLO MODALE CONFIGURAZIONE -->
    <div id="modal-config" class="modal-overlay">
        <div class="modal-contenuto">
            <h2>Configurazione Partita</h2>

            <!-- Selezione Lingua -->
            <div class="config-sezione">
                <label class="config-label">Lingua Smorfia:</label>
                <div class="lingua-opzioni">
                    <button id="btnLinguaNap" class="btn-lingua attivo" onclick="selezionaLingua('nap')">Napoletano</button>
                    <button id="btnLinguaIta" class="btn-lingua" onclick="selezionaLingua('ita')">Italiano</button>
                </div>
            </div>

            <!-- Selezione Premi Abilitati -->
            <div class="config-sezione">
                <label class="config-label">Premi in palio (attivi):</label>
                <div class="premi-checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" value="AMBO" checked> AMBO</label>
                    <label class="checkbox-item"><input type="checkbox" value="TERNO" checked> TERNO</label>
                    <label class="checkbox-item"><input type="checkbox" value="QUATERNA" checked> QUATERNA</label>
                    <label class="checkbox-item"><input type="checkbox" value="CINQUINA" checked> CINQUINA</label>
                    <label class="checkbox-item"><input type="checkbox" value="TOMBOLA" checked> TOMBOLA</label>
                </div>
            </div>

            <!-- Azione Chiudi / Salva -->
            <div class="modal-azioni">
                <button class="btn-salva-config" onclick="salvaChiudiConfig()">Salva e Chiudi</button>
            </div>
        </div>
    </div>
    <script src="./js/tombola.js"></script>
</body>

</html>
