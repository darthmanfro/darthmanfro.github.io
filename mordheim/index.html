<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mordheim - Banda</title>
    <link rel="stylesheet" href="./css/base.css">   <!-- Pagina, testata, comandi comuni -->
    <link rel="stylesheet" href="./css/banda.css">  <!-- Scheda Banda: catalogo e unità -->
    <link rel="stylesheet" href="./css/probabilita.css"> <!-- Scheda Probabilità: bersaglio e confronto -->
    <link rel="stylesheet" href="./css/ottimizzatore.css"> <!-- Scheda Ottimizzatore: proposte -->
    <link rel="stylesheet" href="./css/spiegazioni.css">   <!-- Icone i e finestra delle spiegazioni -->
</head>

<body>

    <header class="testata">
        <h1>Mordheim</h1>
        <div class="testata-scelte">
            <label class="campo">
                <span>Banda</span>
                <select id="sceltaBanda"></select>
            </label>
            <label class="campo campo-corto">
                <span>Corone</span>
                <input type="number" id="corone" min="0" step="5">
            </label>
            <label class="campo campo-bersaglio">
                <span>Bersaglio</span>
                <select id="sceltaBersaglio"></select>
            </label>
            <button type="button" id="btnSvuota" class="btn">Svuota banda</button>
            <a class="btn btn-link" href="istruzioni.html">Istruzioni</a>
        </div>
    </header>

    <!-- Dati non caricati: un file di dati/ manca o ha un errore di scrittura -->
    <div id="errore-caricamento" class="errore-caricamento nascosto">
        <h2>Non riesco a caricare i dati</h2>
        <p>Un file della cartella <code>dati/</code> manca oppure contiene un errore (di solito una virgola
            o una virgoletta di troppo o di meno dopo una modifica a mano). Il file è indicato qui sotto.</p>
        <p class="errore-dettaglio" id="errore-dettaglio"></p>
    </div>

    <nav class="schede" id="schede">
        <button type="button" class="scheda-pulsante" data-scheda="banda">Banda</button>
        <button type="button" class="scheda-pulsante" data-scheda="probabilita">Probabilità</button>
        <button type="button" class="scheda-pulsante" data-scheda="ottimizzatore">Ottimizzatore</button>
    </nav>

    <main>
        <section id="scheda-banda" class="scheda">
            <div id="riepilogo" class="riepilogo"></div>
            <ul id="problemi" class="problemi"></ul>
            <div class="banda-colonne">
                <aside id="catalogo" class="catalogo"></aside>
                <div id="elenco-unita" class="elenco-unita"></div>
            </div>
        </section>

        <section id="scheda-probabilita" class="scheda">
            <div class="prob-pannelli">
                <div id="pannello-bersaglio" class="pannello"></div>
                <div id="pannello-opzioni" class="pannello"></div>
            </div>
            <div id="confronto" class="pannello confronto"></div>
        </section>

        <section id="scheda-ottimizzatore" class="scheda">
            <div id="ottimizzatore-comandi" class="pannello"></div>
            <div id="ottimizzatore-proposte" class="ottimizzatore-proposte"></div>
        </section>
    </main>

    <!-- Spiegazione di una riga: si apre con le icone i (js/spiegazioni.js) -->
    <dialog id="spiegazione" class="spiegazione" aria-labelledby="spiegazione-titolo">
        <div class="spiegazione-riquadro">
            <header class="spiegazione-testata">
                <h2 id="spiegazione-titolo"></h2>
                <button type="button" id="spiegazione-chiudi" class="btn-piccolo" title="Chiudi (Esc)">✕</button>
            </header>
            <div id="spiegazione-testo" class="spiegazione-testo"></div>
        </div>
    </dialog>

    <script src="./js/dati.js"></script>         <!-- Caricamento dei file JSON -->
    <script src="./js/motore.js"></script>       <!-- Calcolo delle probabilità -->
    <script src="./js/banda.js"></script>        <!-- Stato, costi e controlli della banda -->
    <script src="./js/spiegazioni.js"></script>  <!-- Icone i e testi delle spiegazioni -->
    <script src="./js/bersaglio.js"></script>    <!-- Bersaglio e impostazioni -->
    <script src="./js/banda-vista.js"></script>  <!-- Disegno della scheda Banda -->
    <script src="./js/probabilita.js"></script>  <!-- Scheda Probabilità -->
    <script src="./js/ottimizzatore.js"></script>        <!-- Ricerca della banda migliore -->
    <script src="./js/ottimizzatore-vista.js"></script>  <!-- Scheda Ottimizzatore -->
    <script src="./js/app.js"></script>          <!-- Avvio e comandi -->
</body>

</html>
